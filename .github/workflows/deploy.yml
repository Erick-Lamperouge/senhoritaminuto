name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned shared core
        uses: actions/checkout@v4
        with:
          repository: Erick-Lamperouge/estrutura-dos-blogs
          ref: 1817423bbb4ac53c075711e095540f3765bcad0c
          path: .blog-core-source
          sparse-checkout: v2
          persist-credentials: false
      - name: Checkout pinned editorial files only
        uses: actions/checkout@v4
        with:
          repository: Erick-Lamperouge/futebolando
          ref: 202addd2d8f1000da146ce4d37402300102a4d46
          path: .blog-editorial-source
          sparse-checkout: editorial
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install portal dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and verify integrated portfolio
        run: |
          npm run test:portal
          npm run build:integrated
          node scripts/check-blog-integration.mjs
          node scripts/check-public-surface.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
  public-smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify custom domain and isolated preview
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 3 --max-time 20 https://senhoritaminuto.com.br/ -o /tmp/portal.html
          curl -fsSL --retry 4 --retry-delay 3 --max-time 20 https://senhoritaminuto.com.br/projetos/blogs/ -o /tmp/catalog.html
          curl -fsSL --retry 4 --retry-delay 3 --max-time 20 https://senhoritaminuto.com.br/futebolando/ -o /tmp/football.html
          curl -fsSL --retry 4 --retry-delay 3 --max-time 20 https://senhoritaminuto.com.br/futebolando/en/ -o /tmp/football-en.html
          grep -q 'href="/projetos/blogs/"' /tmp/portal.html
          grep -q 'id="archive-character"' /tmp/catalog.html
          grep -q 'data-character-role="minute-brother"' /tmp/catalog.html
          grep -q 'archive-files' /tmp/catalog.html
          grep -q 'id="selector-stage"' /tmp/catalog.html
          grep -q 'id="mascotButton"' /tmp/catalog.html
          curl -fsSL --retry 4 --retry-delay 3 --max-time 20 https://senhoritaminuto.com.br/projetos/jack-up/ -o /tmp/jack.html
          grep -q 'data-mascot-species="alligator"' /tmp/jack.html
          grep -q 'jack-crutch' /tmp/jack.html
          grep -q 'project-speech' /tmp/jack.html
          ! grep -Eq 'data-mascot-motion|project-scene-controls' /tmp/jack.html /tmp/catalog.html
          curl -fsSL --retry 4 --retry-delay 3 --max-time 20 https://senhoritaminuto.com.br/projetos/scratch/ -o /tmp/scratch.html
          grep -q 'id="scratchCat"' /tmp/scratch.html
          grep -q 'href="/futebolando/"' /tmp/catalog.html
          grep -q 'data-article-id="expected-goals"' /tmp/football.html
          grep -q 'lang="en"' /tmp/football-en.html
          grep -q 'noindex,nofollow' /tmp/football.html
          ! grep -Eq 'id="archive-character"|id="mascotButton"|adsbygoogle' /tmp/football.html
          grep -q 'rel="canonical" href="https://senhoritaminuto.com.br/futebolando/"' /tmp/football.html
          grep -q 'rel="canonical" href="https://senhoritaminuto.com.br/futebolando/en/"' /tmp/football-en.html
          curl -fsSL --retry 4 --retry-delay 3 --max-time 20 https://senhoritaminuto.com.br/futebolando/artigos/impedimento/ -o /tmp/article-pt.html
          curl -fsSL --retry 4 --retry-delay 3 --max-time 20 https://senhoritaminuto.com.br/futebolando/en/articles/offside/ -o /tmp/article-en.html
          grep -q 'rel="canonical" href="https://senhoritaminuto.com.br/futebolando/artigos/impedimento/"' /tmp/article-pt.html
          grep -q 'hreflang="en" href="https://senhoritaminuto.com.br/futebolando/en/articles/offside/"' /tmp/article-pt.html
          grep -q 'hreflang="pt-BR" href="https://senhoritaminuto.com.br/futebolando/artigos/impedimento/"' /tmp/article-en.html
          grep -q 'noindex,nofollow' /tmp/article-pt.html
          grep -q 'noindex,nofollow' /tmp/article-en.html
          ! grep -Eq 'application/ld\+json|article:published_time' /tmp/article-pt.html /tmp/article-en.html
          curl -fsSL --retry 4 --retry-delay 3 --max-time 20 https://senhoritaminuto.com.br/futebolando/transparencia/ -o /tmp/trust-pt.html
          curl -fsSL --retry 4 --retry-delay 3 --max-time 20 https://senhoritaminuto.com.br/futebolando/en/transparency/ -o /tmp/trust-en.html
          grep -q 'data-trust-page' /tmp/trust-pt.html
          grep -q 'data-trust-page' /tmp/trust-en.html
          grep -q 'data-contact-pending' /tmp/trust-pt.html
          grep -q 'data-contact-pending' /tmp/trust-en.html
          grep -q 'noindex,nofollow' /tmp/trust-pt.html
          grep -q 'noindex,nofollow' /tmp/trust-en.html
          grep -q 'data-highlight-mode="curated-preview"' /tmp/football.html
          grep -q 'data-football-centre' /tmp/football.html
          grep -q 'data-competition="brasileirao"' /tmp/football.html
          grep -q 'data-competition="world-cup"' /tmp/football-en.html
          grep -q 'Arquivo parcial' /tmp/football.html
          ! grep -q 'data-fixture-date=' /tmp/football.html
          grep -q 'data-color-system="editorial"' /tmp/football.html /tmp/football-en.html
          grep -q -- '--blog-light-tone-bronze:#805522' /tmp/football.html
          grep -q 'data-tone="steel"' /tmp/article-pt.html
          grep -q 'data-tone="steel"' /tmp/article-en.html
          echo "PASS custom domain portal, bilingual SEO, trust, sports archive and editorial palette"
