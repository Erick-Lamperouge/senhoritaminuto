name: Blog integration V2 - validation only
on:
  push:
    branches: ['dev/blog-integration-v2','dev/portfolio-audit-carousel','dev/mascot-scenes-v3','dev/blog-release-flow','dev/blog-trust-intake','dev/blog-sports-centre']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: blog-integration-v2-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned shared core
        uses: actions/checkout@v4
        with:
          repository: Erick-Lamperouge/estrutura-dos-blogs
          ref: 1817423bbb4ac53c075711e095540f3765bcad0c
          path: .blog-core-source
          sparse-checkout: v2
          persist-credentials: false
      - name: Checkout pinned editorial files only
        uses: actions/checkout@v4
        with:
          repository: Erick-Lamperouge/futebolando
          ref: 202addd2d8f1000da146ce4d37402300102a4d46
          path: .blog-editorial-source
          sparse-checkout: editorial
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install portal dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and verify integrated portfolio
        run: |
          npm run test:portal
          npm run build:integrated
          node scripts/check-blog-integration.mjs
          node scripts/check-public-surface.mjs
      - name: Install browser tools
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test portfolio, mascot, catalog and blog
        run: node scripts/test-blog-portal-browser.mjs
      - name: Upload review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-blog-catalog-review
          path: review-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload review-only build
        uses: actions/upload-artifact@v4
        with:
          name: senhoritaminuto-blog-integration-preview
          path: dist/
          retention-days: 7
